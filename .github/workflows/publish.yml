---
name: Publish to npm

"on":
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Nothing downstream pushes or fetches, so leaving a token in the
          # local git config would only widen its blast radius.
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          # piQuota has zero runtime and dev dependencies, so there is no
          # dependency cache worth keeping. Disabling it removes the cache
          # poisoning surface entirely instead of guarding against it.
          # The input is `cache`; `package-manager-cache` is not a setup-node
          # input and GitHub silently ignores unknown keys.
          cache: false

      - name: Run tests
        run: npm test

      # npm exchanges the GitHub OIDC token for a publish token only from
      # 11.5.1 onward, and the npm bundled with the Node 22 line is older.
      # Pinned so publishing never depends on what the runner happens to ship.
      - name: Upgrade npm for OIDC publishing
        run: npm install --global npm@11.12.1

      # No NODE_AUTH_TOKEN here on purpose. When any auth token is set,
      # even an empty one, npm assumes static-token auth and never
      # starts the OIDC exchange, failing with ENEEDAUTH. Trust comes
      # from npm Trusted Publishing, which binds this repo and workflow
      # to the package instead.
      - name: Publish to npm
        run: npm publish --access public --provenance
